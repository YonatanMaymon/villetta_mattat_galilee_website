# Cloudflare deployment: the prerendered site (dist/) and the booking API in one Worker.
#
#   npx wrangler login
#   npx wrangler secret put SMOOBU_API_KEY        # and SMOOBU_API_SECRET, SMOOBU_ICAL_URL
#   npm run deploy
#
# Secrets are set with `wrangler secret put`, never written in this file. Locally, wrangler reads them
# from .dev.vars (git-ignored).
name = "villetta"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
# Unknown addresses get the prerendered 404 page.
not_found_handling = "404-page"
# /gallery is served from gallery/index.html, and /gallery/ redirects to /gallery, matching the canonicals.
html_handling = "drop-trailing-slash"
# Only the API runs Worker code; pages and images come straight from the static assets.
run_worker_first = ["/api/*", "/hapisga.ics"]

# Non-secret settings. These two identify the apartment; they are not credentials.
# The last good copy of the hapisga calendar served at /hapisga.ics (worker/hapisga.ts).
[[kv_namespaces]]
binding = "HAPISGA_CACHE"
id = "b856563cef7540bbb7e4cd0d6e4d96f3"

# Holds a guest's dates on the website while they type their card (worker/holds.ts, server/holds.ts).
[[durable_objects.bindings]]
name = "DATE_HOLDS"
class_name = "DateHoldsObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DateHoldsObject"]

# Every minute: holds that ran out are followed up (booked if the card was saved after all, otherwise the
# owner is emailed that the guest did not finish).
[triggers]
crons = ["* * * * *"]

[vars]
SMOOBU_APARTMENT_ID = "3514936"
SMOOBU_CUSTOMER_ID = "1892906"
# The Cardcom terminal (not a secret). Its API name is a secret: npx wrangler secret put CARDCOM_API_NAME
CARDCOM_TERMINAL_NUMBER = "199960"
